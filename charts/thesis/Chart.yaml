apiVersion: v2
name: thesis
description: Cloud Native Identity Thesis - A comprehensive microservices e-commerce platform

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.0.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.0.0"

# Dependencies
dependencies:
  # Infrastructure services
  - name: postgresql
    version: 12.12.10
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 18.1.5
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: rabbitmq
    version: 12.0.10
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  # Microservices
  - name: basket-api
    version: 0.1.0
    repository: file://./charts/basket-api
    condition: basket-api.enabled
  - name: catalog-api
    version: 0.1.0
    repository: file://./charts/catalog-api
    condition: catalog-api.enabled
  - name: ordering-api
    version: 0.1.0
    repository: file://./charts/ordering-api
    condition: ordering-api.enabled
  - name: webapp-server
    version: 0.1.0
    repository: file://./charts/webapp-server
    condition: webapp-server.enabled

keywords:
  - microservices
  - e-commerce
  - asp.net-core
  - kubernetes
  - thesis

maintainers:
  - name: Tural Hasanov
    email: tural.hasanov11@example.com

home: https://github.com/TuralHasanov11/Cloud-Native-Identity-Thesis
