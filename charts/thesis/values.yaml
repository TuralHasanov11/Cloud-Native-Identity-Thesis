# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Docker registry configuration
dockerRegistry: "turalhasanov/thesis/"

# Namespace configuration
namespaceOverride: ""

# Common labels applied to all resources
commonLabels: {}

# Common annotations applied to all resources
commonAnnotations: {}

# Service Account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC configuration
rbac:
  create: true

# Pod Security Context
podSecurityContext:
  fsGroup: 2000

# Security Context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Basket API configuration
basket-api:
  enabled: true
  replicaCount: 1
  
  image:
    repository: turalhasanov/thesis/basket-api
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 5100
  
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/"
    hosts:
      - host: basket-api.local
        paths:
          - path: /basket
            pathType: Prefix
    tls: []
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://seq:5341/ingest/otlp/v1/traces"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
    - name: OTEL_EXPORTER_OTLP_HEADERS
      value: "X-Seq-ApiKey=XMdIiVvcRbsIkFf2U7DQ"
    - name: ConnectionStrings__RedisCache
      value: "thesis-redis-master:6379"
    - name: MessageBroker__Host
      value: "amqp://thesis-rabbitmq:5672"
    - name: MessageBroker__Username
      value: "user"
    - name: MessageBroker__Password
      value: "bitnami"
    - name: ASPNETCORE_ENVIRONMENT
      value: "Production"
    - name: ASPNETCORE_URLS
      value: "http://+:80"

