apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-server-deployment
  labels:
    app: webapp-server
  namespace: thesis
spec:
  ingressClassName: thesis-ingress
  replicas: 1
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: webapp-server
  template:
    metadata:
      labels:
        app: webapp-server
    spec:
      containers:
        - name: webapp.server
          image: "{{ .Values.webapp_image.name }}:{{ .Values.webapp_image.tag }}" # turalhasanov/thesis/webappserver:1.0.0 #{{.Values.version}}
          # imagePullPolicy: Always
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          ports:
            - containerPort: 5113
          readinessProbe:
            httpGet:
              path: /health
              port: 5113
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5113
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-server-service
  labels:
    app: webapp-server
  namespace: thesis
spec:
  # type: LoadBalancer
  selector:
    app: webapp-server
  ports:
  - name: http
    protocol: TCP
    port: 5113
    targetPort: 5113
